# Dependency updates arrive as PRs that CI tests, instead of CI installing @latest on every run.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/app", "/backend"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories: ["/services/identity-api", "/services/vendor-api"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
