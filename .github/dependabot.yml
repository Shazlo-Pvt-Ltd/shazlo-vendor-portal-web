# Dependency updates arrive as PRs that CI tests, instead of CI installing @latest on every run.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/app", "/backend"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # @vitest/coverage-v8 pins vitest to its own exact version, so separate PRs fail npm ci.
      # Dependabot uses the first matching group, so this one must stay above npm-minor-and-patch.
      vitest:
        patterns: ["vitest", "@vitest/*"]
        update-types: [major, minor, patch]
      # @vitejs/plugin-react declares the Vite majors it supports as a peer range, so a major of
      # either one alone fails npm ci. Keep this above npm-minor-and-patch for the same reason.
      vite:
        patterns: ["vite", "@vitejs/plugin-react"]
        update-types: [major, minor, patch]
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories: ["/services/identity-api", "/services/vendor-api", "/services/central-stub", "/packages/py-auth", "/packages/py-security"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
