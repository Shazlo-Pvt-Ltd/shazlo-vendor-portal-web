name: apps-ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Advisories published after a merge reach main here instead of failing unrelated PRs.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # PRs that only touch Python services, infra or docs skip the web jobs.
    # A skipped job still reports success, so it never leaves a check pending.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      web: ${{ steps.diff.outputs.web }}
      deps: ${{ steps.diff.outputs.deps }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "deps=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          printf '%s\n' "$files"
          # Unlisted paths run the web jobs. The contract tests read docs/adr/0003-contract.
          web=$( {
            printf '%s\n' "$files" | grep -E '^docs/adr/0003-contract/'
            printf '%s\n' "$files" | grep -Ev '^(services/|packages/py-|docker/|docs/)|^docker-compose\.yml$|^\.env\.example$|^\.github/workflows/(services-ci|codeql|footer_removal)\.yml$'
          } || true)
          deps=$(printf '%s\n' "$files" | grep -E '(^|/)package(-lock)?\.json$' || true)
          echo "web=$([ -n "$web" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "deps=$([ -n "$deps" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  audit:
    # Only PRs that change npm manifests must leave the audit clean; main and the weekly run report the rest.
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      # npm audit reads the lockfile; no install needed.
      - name: Audit test and workspace dependencies
        run: npm audit --audit-level=moderate

  check:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            backend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm ci --prefix app --prefer-offline --no-audit --no-fund
      - run: npm ci --prefix backend --prefer-offline --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Record tested source and environment
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/source-sha.txt
          node --version > reports/node-version.txt
          npm --version > reports/npm-version.txt
      - run: npm run test:ci
      - run: npm run build:demo --workspace @shazlo/ui
      - run: npm run build --prefix app
      - name: Retain test results and coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apps-tests-${{ github.sha }}
          path: |
            reports/
            coverage/
          retention-days: 14
          if-no-files-found: warn
