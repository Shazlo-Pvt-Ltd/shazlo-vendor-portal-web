name: apps-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apps-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix app
      - run: npm ci --prefix backend
      - name: Audit test and workspace dependencies
        run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - name: Record tested source and environment
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/source-sha.txt
          node --version > reports/node-version.txt
          npm --version > reports/npm-version.txt
      - run: npm run test:ci
      - run: npm run build:demo --workspace @shazlo/ui
      - run: npm run build --prefix app
      - name: Retain test results and coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apps-tests-${{ github.sha }}
          path: |
            reports/
            coverage/
          retention-days: 14
          if-no-files-found: warn
