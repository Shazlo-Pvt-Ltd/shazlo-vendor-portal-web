name: e2e-shazlo-one

# The Shazlo-One shell's browser tests against the real stack: identity-api, vendor-api (with its
# worker), Postgres, Redis, Mailpit and the image-host stub (docker-compose.e2e.yml), the shell and
# the reference module (Vite dev servers: the module is development-only). apps/shazlo-one/README.md,
# "End-to-end tests", has the same steps for a laptop. Not a required check: on a pull request it
# runs only when something it exercises changes; it runs on every push to main.
on:
  pull_request:
    paths:
      - "apps/shazlo-one/**"
      - "packages/shell-protocol/**"
      - "packages/ui/**"
      - "services/vendor-api/**"
      - "services/identity-api/**"
      - "packages/py-auth/**"
      - "packages/py-security/**"
      - "docker/**"
      - "docker-compose.yml"
      - "docker-compose.e2e.yml"
      - ".env.example"
      - "docs/adr/0003-contract/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/e2e-shazlo-one.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-shazlo-one-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every `docker compose` call below uses the test stack.
  COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
  COMPOSE_PROFILES: identity,vendor
  # Test-only credentials for the throwaway stack of this job.
  SEED_ADMIN_EMAIL: admin@shazlo.test
  E2E_ADMIN_SEED_PASSWORD: e2e-admin-password-1
  E2E_ADMIN_PASSWORD: e2e-admin-password-2

jobs:
  shazlo-one:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=e2e-ci/' .env
      - name: Build the images
        run: docker compose build identity-api vendor-api
      - name: Generate both signing keys into .env
        run: |
          gen='import json; from shazlo_security.keys import generate_private_key, new_kid, private_key_pem; print(json.dumps({new_kid(): private_key_pem(generate_private_key()).decode()}, separators=(",", ":")))'
          identity=$(docker compose run --rm --no-deps -T identity-api python -c "$gen")
          vendor=$(docker compose run --rm --no-deps -T vendor-api python -c "$gen")
          grep -v -e '^IDENTITY_JWT_KEYS=' -e '^VENDOR_JWT_KEYS=' .env > .env.new
          printf 'IDENTITY_JWT_KEYS=%s\nVENDOR_JWT_KEYS=%s\n' "$identity" "$vendor" >> .env.new
          mv .env.new .env
      - name: Start the databases and run the migrations
        run: |
          docker compose up -d --wait postgres redis mailpit
          docker compose run --rm identity-api alembic upgrade head
          docker compose run --rm vendor-api alembic upgrade head
      - name: Seed the admin
        run: >-
          docker compose run --rm
          -e SEED_ADMIN_EMAIL -e SEED_ADMIN_PASSWORD="$E2E_ADMIN_SEED_PASSWORD"
          identity-api python -m identity_api.cli seed
      - name: Start the stack
        run: |
          docker compose up -d --wait
          curl -fsS localhost:8001/ready
          curl -fsS localhost:8002/ready

      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/shazlo-one
      - name: Browser tests (the shell and the reference module start themselves)
        run: npm run e2e
        working-directory: apps/shazlo-one
        env:
          CI: "true"

      - name: Keep the traces, screenshots and report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shazlo-one-e2e-${{ github.sha }}
          path: |
            apps/shazlo-one/test-results/
            apps/shazlo-one/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Stop the stack
        if: always()
        run: docker compose down -v
