name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # New queries and advisories reach main weekly, not only when someone pushes.
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  # Only PR runs are superseded; every main push and the weekly run keep their own analysis.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    # The `Analyze (...)` names are required status checks: keep them.
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # uploads the analysis to code scanning
    strategy:
      fail-fast: false
      matrix:
        # `actions` analyses the workflow files in .github/workflows.
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The default queries plus the lower-precision security ones (log injection, partial
          # SSRF, workflow code injection, ...). See docs/security-scanning.md.
          queries: security-extended
      - name: Analyze and upload results
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
