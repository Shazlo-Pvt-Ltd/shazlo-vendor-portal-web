name: dependency-review

# Compares the dependency graph of the PR's base and head and fails on what the PR adds:
# a dependency with a known high or critical vulnerability, or a runtime dependency under a strong
# copyleft licence. Dependencies that are already on the base branch never fail a PR here
# (osv-scanner and the weekly audits report those). Needs no secrets, so fork PRs work too.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The summary goes to the job log and the run summary only: a PR comment needs
      # `pull-requests: write`, which fork PRs do not get.
      - name: Vulnerabilities in added dependencies (any scope)
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          vulnerability-check: true
          license-check: false
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          show-patched-versions: true
          comment-summary-in-pr: never
      - name: Strong copyleft licences in added runtime dependencies
        if: ${{ !cancelled() }}
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          vulnerability-check: false
          license-check: true
          fail-on-scopes: runtime
          # GPL and AGPL (every version, -only and -or-later). An exception for one package goes
          # in allow-dependencies-licenses with a comment saying why (docs/security-scanning.md).
          deny-licenses: >-
            GPL-1.0-only, GPL-1.0-or-later, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later,
            AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: never
