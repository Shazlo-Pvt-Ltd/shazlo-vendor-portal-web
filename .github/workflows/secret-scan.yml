name: secret-scan

# gitleaks over the commits a pull request adds, the commits a push to main adds, and weekly over
# the whole history of every branch. Uses the released CLI (checksum verified), not the gitleaks
# action, which needs a paid licence for organisation repositories. Configuration and the test
# values it ignores: .gitleaks.toml. What to do with a finding: docs/security-scanning.md.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bump both together (Dependabot does not update release binaries). The SHA-256 is the
  # linux_x64 line of gitleaks_<version>_checksums.txt in the release.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit (and, for the weekly run, every branch) has to be present to be scanned.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Choose the commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)
              # A new branch has no "before" (all zeros), and after a force push it is not in the
              # clone: scan everything the branch holds.
              if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                range="$PUSH_BEFORE..$PUSH_AFTER"
              else
                range="$PUSH_AFTER"
              fi
              ;;
            *) range="--all" ;;
          esac
          # When git rejects the range, gitleaks scans nothing and still exits 0: check it here.
          commits=$(git rev-list --count "$range")
          echo "Scanning: $range ($commits commits)"
          echo "log-opts=$range" >> "$GITHUB_OUTPUT"
      - name: Scan
        env:
          LOG_OPTS: ${{ steps.range.outputs.log-opts }}
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --config .gitleaks.toml \
            --log-opts="$LOG_OPTS" \
            --redact \
            --no-banner \
            --verbose
