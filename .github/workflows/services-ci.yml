name: services-ci

# Every PR and main push runs every matrix entry, so the required `test (...)` checks always
# report; a path filter would leave a skipped service's required check pending.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: services-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [identity-api, vendor-api, py-auth]
    defaults:
      run:
        working-directory: ${{ matrix.service == 'py-auth' && 'packages/py-auth' || format('services/{0}', matrix.service) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shazlo
          POSTGRES_PASSWORD: shazlo
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shazlo -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # identity-api's end-to-end test needs a real Redis. It empties database 1, never 0.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shazlo:shazlo@localhost:5432/test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service == 'py-auth' && 'packages/py-auth' || format('services/{0}', matrix.service) }}/pyproject.toml
      # The shared package is a path dependency: install it first, so the service's own install
      # finds it. `compat` editable mode keeps it visible to mypy.
      - if: matrix.service != 'py-auth'
        run: |
          if grep -q shazlo-auth pyproject.toml; then
            pip install -e '../../packages/py-auth[fastapi]' --config-settings editable_mode=compat
          fi
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Record tested source and environment
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/source-sha.txt
          python --version > reports/python-version.txt
      - run: pytest --junitxml=reports/pytest.xml
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.service }}-tests-${{ github.sha }}
          path: ${{ matrix.service == 'py-auth' && 'packages/py-auth' || format('services/{0}', matrix.service) }}/reports/
          retention-days: 14
          if-no-files-found: warn
