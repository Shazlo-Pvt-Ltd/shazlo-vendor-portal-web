name: services-ci

# Every PR and main push runs every matrix entry, so the required `test (...)` checks always
# report; a path filter would leave a skipped service's required check pending.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: services-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [identity-api, vendor-api, py-auth]
    defaults:
      run:
        working-directory: ${{ matrix.service == 'py-auth' && 'packages/py-auth' || format('services/{0}', matrix.service) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shazlo
          POSTGRES_PASSWORD: shazlo
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shazlo -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # identity-api's end-to-end test needs a real Redis. It empties database 1, never 0.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shazlo:shazlo@localhost:5432/test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service == 'py-auth' && 'packages/py-auth' || format('services/{0}', matrix.service) }}/pyproject.toml
      # Shared packages (packages/py-auth) come from the repository path, never from an index:
      # a service lists them in requirements-shared.txt, not in its pyproject dependencies.
      - if: matrix.service != 'py-auth'
        run: |
          if [ -f requirements-shared.txt ]; then
            pip install -r requirements-shared.txt
          fi
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Record tested source and environment
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/source-sha.txt
          python --version > reports/python-version.txt
      - run: pytest --junitxml=reports/pytest.xml
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.service }}-tests-${{ github.sha }}
          path: ${{ matrix.service == 'py-auth' && 'packages/py-auth' || format('services/{0}', matrix.service) }}/reports/
          retention-days: 14
          if-no-files-found: warn

  # Follows README.md (Local development) with the real compose file and image: the unit tests
  # above never build the Dockerfile, so a broken build context would otherwise pass CI.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=compose-ci/' .env
      - run: docker compose up -d --wait
      - run: docker compose --profile identity build identity-api
      - name: Generate a signing key into .env
        run: |
          line=$(docker compose --profile identity run --rm --no-deps -T identity-api python -c "import json; from identity_api.services.keys import generate_private_key, new_kid, private_key_pem; print('IDENTITY_JWT_KEYS=' + json.dumps({new_kid(): private_key_pem(generate_private_key()).decode()}, separators=(',', ':')))")
          grep -v '^IDENTITY_JWT_KEYS=' .env > .env.new
          printf '%s\n' "$line" >> .env.new
          mv .env.new .env
      - run: docker compose --profile identity run --rm identity-api alembic upgrade head
      - run: >-
          docker compose --profile identity run --rm
          -e SEED_ADMIN_EMAIL=admin@shazlo.test -e SEED_ADMIN_PASSWORD=compose-ci-password-1
          identity-api python -m identity_api.cli seed
      - run: docker compose --profile identity up -d --wait
      - name: Ready and sign-in
        run: |
          curl -fsS localhost:8001/ready
          curl -fsS localhost:8001/.well-known/jwks.json | grep -q '"kid"'
          curl -fsS localhost:8001/v1/auth/login -H 'content-type: application/json' \
            -d '{"email": "admin@shazlo.test", "password": "compose-ci-password-1"}' \
            | grep -q '"access_token"'
      - name: Logs
        if: failure()
        run: docker compose --profile identity logs
      - name: Clean up
        if: always()
        run: docker compose --profile identity down -v
