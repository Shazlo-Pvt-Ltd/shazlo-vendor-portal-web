name: Remove Claude footer

on:
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  issues: write
  pull-requests: write

jobs:
  strip-footer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Strip "Generated with Claude Code" footer
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const item = context.payload.issue || context.payload.pull_request;
            const body = item.body || '';

            // Matches: 🤖 Generated with [Claude Code](https://claude.com/claude-code)
            // (also the older claude.ai/code link and plain-text variants)
            const footer = /^[ \t]*(?:🤖\s*)?Generated with\s+\[?Claude Code\]?(?:\([^)\n]*\))?[ \t]*$/gim;

            if (!footer.test(body)) {
              core.info('No Claude footer found; nothing to do.');
              return;
            }
            footer.lastIndex = 0;

            const cleaned = body
              .replace(footer, '')
              .replace(/\n{3,}/g, '\n\n')
              .trimEnd();

            // Fork PRs receive a read-only token on pull_request events.
            // Keep the job successful without attempting an unauthorized write.
            const pr = context.payload.pull_request;
            if (pr && pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.info('Fork PR: footer cleanup requires a maintainer with write access.');
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: item.number,
              body: cleaned,
            });
            core.info(`Removed footer from #${item.number}.`);
