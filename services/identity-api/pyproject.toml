[project]
name = "identity-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pydantic-settings>=2.7",
    "asyncpg>=0.32.0",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "alembic>=1.20.1",
    # 2.10.1+: 2.10.0 checks `iss` as a partial match (CVE-2024-53861).
    "pyjwt[crypto]>=2.15.1",
    # shazlo-auth (packages/py-auth) and shazlo-security (packages/py-security) are deliberately
    # not listed: the name is not ours on PyPI, so
    # a plain requirement could install someone else's package. They come from the repository
    # path via requirements-shared.txt (and the Dockerfile builds it from the path).
    # Sync driver for Alembic; the app itself uses asyncpg.
    "psycopg[binary]>=3.3.8",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio>=1.4.1.post1", "httpx>=0.28.1", "fakeredis[lua]>=2.26"]

[tool.setuptools.packages.find]
include = ["identity_api*"]

[tool.setuptools.package-data]
"identity_api.migrations" = ["script.py.mako"]

[tool.ruff]
extend = "../ruff.toml"

[tool.mypy]
strict = true
files = ["identity_api", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
