services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shazlo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shazlo} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    # AOF so refresh tokens (sessions) survive a restart; `everysec` risks at most ~1s of writes.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      # Local only: this Redis has no password.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Opt-in (`--profile identity`): it needs a signing key in IDENTITY_JWT_KEYS, so a plain
  # `docker compose up -d` starts only Postgres and Redis. See README.md, Local development.
  identity-api:
    profiles: ["identity"]
    build:
      # The image also contains packages/py-auth, so the context is the repository root
      # (services/identity-api/Dockerfile.dockerignore limits what is sent).
      context: .
      dockerfile: services/identity-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-shazlo}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/identity
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${IDENTITY_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      JWT_ISSUER: http://localhost:${IDENTITY_API_PORT:-8001}
      # Keys come from the environment, not a bind mount: a mounted PEM fails the private-key
      # file-mode check (Docker Desktop shows it as world readable) or is unreadable for the
      # container user (Linux, different uid).
      JWT_KEYS: ${IDENTITY_JWT_KEYS:-}
      JWT_SIGNING_KID: ${IDENTITY_JWT_SIGNING_KID:-}
    ports:
      - "${IDENTITY_API_PORT:-8001}:8001"

volumes:
  postgres-data:
  redis-data:
