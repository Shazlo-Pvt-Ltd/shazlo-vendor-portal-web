[project]
name = "shazlo-security"
version = "0.1.0"
description = "Security code shared by identity-api and vendor-api: password hashing, rate limiting, client IP"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio>=0.24", "fakeredis[lua]>=2.26"]

[tool.setuptools.packages.find]
include = ["shazlo_security*"]

[tool.setuptools.package-data]
shazlo_security = ["py.typed"]

[tool.ruff]
extend = "../../services/ruff.toml"

[tool.ruff.lint.per-file-ignores]
# The shared config's test ignores are relative to services/, so repeat them here.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["shazlo_security", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
