# The end-to-end stack for the vendor portal's browser tests (apps/vendor-portal/e2e). Use it on
# top of the main file, with the identity and vendor profiles:
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile identity --profile vendor up -d --wait
#
# apps/vendor-portal/README.md ("End-to-end tests") has every step; CI runs them in the e2e workflow.
# Never use this file for anything but tests: it turns image uploads over to a stub.
services:
  vendor-api:
    environment:
      # Uploads are "on" with made-up credentials. The browser's upload to Cloudinary is intercepted
      # by the tests, and vendor-api's check of the stored file goes to the stub below instead of
      # Cloudinary (CLOUDINARY_ADMIN_API_URL is refused outside dev and test).
      CLOUDINARY_CLOUD_NAME: e2e
      CLOUDINARY_API_KEY: e2e-key
      CLOUDINARY_API_SECRET: e2e-not-a-secret
      CLOUDINARY_ROOT_FOLDER: shazlo-e2e
      CLOUDINARY_ADMIN_API_URL: http://image-host-stub:8004
    depends_on:
      image-host-stub:
        condition: service_healthy

  image-host-stub:
    profiles: ["vendor", "full"]
    image: python:3.12-slim
    command: ["python", "/stub/server.py"]
    volumes:
      - ./docker/image-host-stub:/stub:ro
    # Not published: only vendor-api calls it, over the compose network.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 2s
      timeout: 3s
      retries: 15
