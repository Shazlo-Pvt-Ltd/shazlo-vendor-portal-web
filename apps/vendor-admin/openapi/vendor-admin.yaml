openapi: 3.1.0
info:
  title: vendor-api admin routes (what the vendor-admin module calls)
  version: 0.1.0
  description: |
    From docs/05-api-design.md §6 (vendors, products, outbox) plus the review views the module needs
    (marked x-proposal). Called with a 5-minute token exchanged by the shell for audience vendor-api
    (ADR 0009); the reviewer always comes from that token.
paths:
  /api/v1/admin/summary:
    get:
      x-proposal: true
      responses:
        '200': { description: Counts for the shell home and the queue header, content: { application/json: { schema: { $ref: '#/components/schemas/Summary' } } } }
  /api/v1/admin/queue:
    get:
      x-proposal: true
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/ItemKind' } }
        - { name: vendor, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: submitted, in: query, schema: { type: string, enum: [today, '24h', older] } }
        - { name: resubmissions, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [oldest, newest] } }
      responses:
        '200': { description: Items waiting for a decision, content: { application/json: { schema: { $ref: '#/components/schemas/QueuePage' } } } }
  /api/v1/admin/products/{id}/review:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      x-proposal: true
      responses:
        '200': { description: Submitted version, the one to compare with, and history, content: { application/json: { schema: { $ref: '#/components/schemas/ProductReview' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/products/{id}/approve:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      responses:
        '200': { description: Approved and queued for publishing, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/admin/products/{id}/reject:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RejectBody' } } } }
      responses:
        '200': { description: Sent back, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/admin/brand-pages/{vendor_id}/review:
    parameters: [{ name: vendor_id, in: path, required: true, schema: { type: string } }]
    get:
      x-proposal: true
      responses:
        '200': { description: Live and submitted brand page, content: { application/json: { schema: { $ref: '#/components/schemas/BrandReview' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/brand-pages/{vendor_id}/approve:
    parameters: [{ name: vendor_id, in: path, required: true, schema: { type: string } }]
    post:
      x-proposal: true
      responses:
        '200': { description: Approved, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
  /api/v1/admin/brand-pages/{vendor_id}/reject:
    parameters: [{ name: vendor_id, in: path, required: true, schema: { type: string } }]
    post:
      x-proposal: true
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RejectBody' } } } }
      responses:
        '200': { description: Sent back, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/admin/vendors:
    get:
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/VendorStatus' } }
        - { name: q, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, newest, products] } }
      responses:
        '200': { description: Vendors, content: { application/json: { schema: { $ref: '#/components/schemas/VendorPage' } } } }
  /api/v1/admin/vendors/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      x-proposal: true
      responses:
        '200': { description: Vendor with application, checks and activity, content: { application/json: { schema: { $ref: '#/components/schemas/VendorDetail' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/vendors/{id}/approve:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [commission_bps, agreement_ref], properties: { commission_bps: { type: integer }, agreement_ref: { type: string }, owner_email: { type: string } } } } } }
      responses:
        '200': { description: Approved; owner invited, content: { application/json: { schema: { $ref: '#/components/schemas/VendorDetail' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/admin/vendors/{id}/reject:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses:
        '200': { description: Rejected, content: { application/json: { schema: { $ref: '#/components/schemas/VendorDetail' } } } }
  /api/v1/admin/vendors/{id}/request-info:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      x-proposal: true
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [message], properties: { message: { type: string } } } } } }
      responses:
        '200': { description: Asked, content: { application/json: { schema: { $ref: '#/components/schemas/VendorDetail' } } } }
  /api/v1/admin/vendors/{id}/suspend:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses:
        '200': { description: Suspended, content: { application/json: { schema: { $ref: '#/components/schemas/VendorDetail' } } } }
  /api/v1/admin/vendors/{id}/reactivate:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      responses:
        '200': { description: Reactivated, content: { application/json: { schema: { $ref: '#/components/schemas/VendorDetail' } } } }
  /api/v1/admin/outbox:
    get:
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OutboxStatus' } }
      responses:
        '200': { description: Events to the consumer app, content: { application/json: { schema: { $ref: '#/components/schemas/OutboxPage' } } } }
  /api/v1/admin/outbox/{id}/retry:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      responses:
        '200': { description: Retried, content: { application/json: { schema: { $ref: '#/components/schemas/OutboxEvent' } } } }
  /api/v1/admin/outbox/retry-failed:
    post:
      x-proposal: true
      responses:
        '200': { description: Retried every failed event, content: { application/json: { schema: { type: object, required: [retried], properties: { retried: { type: integer } } } } } }
components:
  responses:
    Error:
      description: Error envelope
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [message, extra]
      properties:
        message: { type: string }
        extra: { type: object, required: [code], properties: { code: { type: string }, fields: { type: object, additionalProperties: { type: string } } } }
    ItemKind: { type: string, enum: [product, brand_page, application] }
    VendorStatus: { type: string, enum: [applied, under_review, approved, rejected, suspended] }
    OutboxStatus: { type: string, enum: [waiting, retrying, failed, delivered] }
    VendorRef:
      type: object
      required: [id, name]
      properties: { id: { type: string }, name: { type: string } }
    Summary:
      type: object
      required: [queue, decided_today, median_minutes, resubmissions, publishing, recent]
      properties:
        queue: { type: object, required: [all, product, brand_page, application, over_24h], properties: { all: { type: integer }, product: { type: integer }, brand_page: { type: integer }, application: { type: integer }, over_24h: { type: integer } } }
        decided_today: { type: integer }
        median_minutes: { type: [integer, 'null'] }
        resubmissions: { type: integer }
        publishing: { type: object, required: [waiting, retrying, failed, delivered_24h], properties: { waiting: { type: integer }, retrying: { type: integer }, failed: { type: integer }, delivered_24h: { type: integer } } }
        recent:
          type: array
          items:
            type: object
            required: [id, kind, subject_id, title, vendor, decision, at, reviewer]
            properties:
              id: { type: string }
              subject_id: { type: string, description: Product id, or the vendor id for brand pages and applications }
              kind: { $ref: '#/components/schemas/ItemKind' }
              title: { type: string }
              vendor: { $ref: '#/components/schemas/VendorRef' }
              decision: { type: string, enum: [approved, rejected] }
              at: { type: string, format: date-time }
              reviewer: { type: string }
    QueueItem:
      type: object
      required: [id, kind, subject_id, title, detail, vendor, submitted_at, change, resubmission, thumbnail_url]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/ItemKind' }
        subject_id: { type: string }
        title: { type: string }
        detail: { type: string }
        vendor: { $ref: '#/components/schemas/VendorRef' }
        submitted_at: { type: string, format: date-time }
        change: { type: string, enum: [new, edit, application] }
        resubmission: { type: integer, description: 0 for a first submission }
        thumbnail_url: { type: [string, 'null'] }
    QueuePage:
      type: object
      required: [items, counts, vendors]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/QueueItem' } }
        counts: { type: object, required: [all, product, brand_page, application], properties: { all: { type: integer }, product: { type: integer }, brand_page: { type: integer }, application: { type: integer } } }
        vendors: { type: array, items: { $ref: '#/components/schemas/VendorRef' } }
    ProductVersion:
      type: object
      required: [title, description, category, gender, fabric, price_paise, mrp_paise, variants, images]
      properties:
        title: { type: string }
        description: { type: string }
        category: { type: string }
        gender: { type: string }
        fabric: { type: string }
        price_paise: { type: integer }
        mrp_paise: { type: integer }
        variants: { type: array, items: { type: object, required: [size, sku, stock], properties: { size: { type: string }, sku: { type: string }, stock: { type: integer } } } }
        images: { type: array, items: { type: object, required: [id, url, angle], properties: { id: { type: string }, url: { type: string }, angle: { type: string, enum: [front, back, closeup, extra] } } } }
    ProductReview:
      type: object
      required: [id, sku, status, vendor, submitted_at, resubmission, submitted, compare_to, compare_label, history, prev_id, next_id]
      properties:
        id: { type: string }
        sku: { type: string }
        status: { type: string, enum: [pending_review, approved, rejected] }
        vendor: { $ref: '#/components/schemas/VendorRef' }
        submitted_at: { type: string, format: date-time }
        resubmission: { type: integer }
        submitted: { $ref: '#/components/schemas/ProductVersion' }
        compare_to: { oneOf: [{ $ref: '#/components/schemas/ProductVersion' }, { type: 'null' }] }
        compare_label: { type: [string, 'null'], enum: [sent_back, live, null] }
        history: { $ref: '#/components/schemas/History' }
        prev_id: { type: [string, 'null'] }
        next_id: { type: [string, 'null'] }
    History:
      type: array
      items:
        type: object
        required: [at, event, by]
        properties:
          at: { type: string, format: date-time }
          event: { type: string, enum: [submitted, approved, rejected, published, applied, info_requested, suspended, reactivated, invited] }
          by: { type: string }
          note: { type: string }
    BrandProfile:
      type: object
      required: [tagline, story, based_in, cover_url, logo_url, return_policy, dispatch_time, instagram, website]
      properties:
        tagline: { type: string }
        story: { type: string }
        based_in: { type: string }
        cover_url: { type: [string, 'null'] }
        logo_url: { type: [string, 'null'] }
        return_policy: { type: string }
        dispatch_time: { type: string }
        instagram: { type: string }
        website: { type: string }
    BrandReview:
      type: object
      required: [vendor, submitted_at, live, draft, changed_fields, history, prev_id, next_id]
      properties:
        vendor: { $ref: '#/components/schemas/VendorRef' }
        submitted_at: { type: string, format: date-time }
        live: { oneOf: [{ $ref: '#/components/schemas/BrandProfile' }, { type: 'null' }] }
        draft: { $ref: '#/components/schemas/BrandProfile' }
        changed_fields: { type: array, items: { type: string } }
        history: { $ref: '#/components/schemas/History' }
        prev_id: { type: [string, 'null'] }
        next_id: { type: [string, 'null'] }
    RejectBody:
      type: object
      required: [reason_code, reason]
      properties:
        reason_code: { type: string, enum: [photos, price, category, prohibited, description, brand_images, contact_details, other] }
        reason: { type: string, minLength: 10, maxLength: 600 }
    Decision:
      type: object
      required: [id, decision, at, next_id]
      properties:
        id: { type: string }
        decision: { type: string, enum: [approved, rejected] }
        at: { type: string, format: date-time }
        next_id: { type: [string, 'null'], description: The next item waiting in the queue }
    VendorSummary:
      type: object
      required: [id, brand_name, owner_name, email, phone, city, sells, status, live_products, since, commission_bps]
      properties:
        id: { type: string }
        brand_name: { type: string }
        owner_name: { type: string }
        email: { type: string }
        phone: { type: string }
        city: { type: string }
        sells: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/VendorStatus' }
        live_products: { type: integer }
        since: { type: string, format: date-time }
        commission_bps: { type: [integer, 'null'] }
    VendorPage:
      type: object
      required: [items, counts, cities]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/VendorSummary' } }
        counts: { type: object, required: [all, applied, under_review, approved, rejected, suspended], properties: { all: { type: integer }, applied: { type: integer }, under_review: { type: integer }, approved: { type: integer }, rejected: { type: integer }, suspended: { type: integer } } }
        cities: { type: array, items: { type: string } }
    VendorDetail:
      allOf:
        - { $ref: '#/components/schemas/VendorSummary' }
        - type: object
          required: [application, checks, products, brand_live, history]
          properties:
            application:
              type: object
              required: [instagram_or_website, product_types, price_min_paise, price_max_paise, about, applied_at]
              properties:
                instagram_or_website: { type: string }
                product_types: { type: array, items: { type: string } }
                price_min_paise: { type: integer }
                price_max_paise: { type: integer }
                about: { type: string }
                applied_at: { type: string, format: date-time }
            checks: { type: array, items: { type: object, required: [label, ok, note], properties: { label: { type: string }, ok: { type: boolean }, note: { type: string } } } }
            products: { type: array, items: { type: object, required: [id, title, status, price_paise, thumbnail_url], properties: { id: { type: string }, title: { type: string }, status: { type: string }, price_paise: { type: integer }, thumbnail_url: { type: [string, 'null'] } } } }
            brand_live: { type: boolean }
            history: { $ref: '#/components/schemas/History' }
    OutboxEvent:
      type: object
      required: [id, event, subject, vendor, status, tries, created_at, last_attempt_at, next_attempt_at, last_error, payload]
      properties:
        id: { type: string }
        event: { type: string, enum: [product.published, product.updated, product.unpublished, brand_profile.published, vendor.status_changed] }
        subject: { type: string }
        vendor: { $ref: '#/components/schemas/VendorRef' }
        status: { $ref: '#/components/schemas/OutboxStatus' }
        tries: { type: integer }
        created_at: { type: string, format: date-time }
        last_attempt_at: { type: [string, 'null'], format: date-time }
        next_attempt_at: { type: [string, 'null'], format: date-time }
        last_error: { type: [string, 'null'] }
        payload: { type: object, additionalProperties: true }
    OutboxPage:
      type: object
      required: [items, counts]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OutboxEvent' } }
        counts: { type: object, required: [all, waiting, retrying, failed, delivered], properties: { all: { type: integer }, waiting: { type: integer }, retrying: { type: integer }, failed: { type: integer }, delivered: { type: integer } } }
