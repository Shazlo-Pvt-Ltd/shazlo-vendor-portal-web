openapi: 3.1.0
info:
  title: Shazlo vendor portal API (portal-side contract)
  version: 0.1.0
  description: |
    The routes the seller portal calls, written from docs/05-api-design.md section 5 before
    vendor-api implements them. Routes marked `x-proposal: true` are not in the design doc yet;
    they are what the screens need and should be reviewed with the vendor-api owners.
    When vendor-api serves its own openapi.json, generate src/api/schema.d.ts from that instead
    and delete this file.
servers:
  - url: http://localhost:8001
paths:
  /api/v1/public/vendor-applications:
    post:
      operationId: applyToSell
      x-proposal: true
      description: Changed in Build 2 - sign-up now collects the store details (delivery, returns, payment on delivery, payouts, business, proposed commission); 422 field keys are dot paths into the body, like delivery.pickup_address.pin.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VendorApplication' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicationReceipt' } } } }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/public/ifsc/{code}:
    get:
      operationId: lookupIfsc
      x-proposal: true
      description: Bank and branch for an IFSC code, so payout forms can show the bank name; public because sign-up asks for it. 422 when the code is not in the IFSC format, 404 when no bank has it.
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Bank branch, content: { application/json: { schema: { $ref: '#/components/schemas/IfscBank' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/vendor/auth/login:
    post:
      operationId: login
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [identifier, password], properties: { identifier: { type: string }, password: { type: string } } } } } }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/vendor/auth/refresh:
    post:
      operationId: refresh
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } } } } }
      responses:
        '200': { description: New pair, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/vendor/auth/logout:
    post:
      operationId: logout
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } } } } }
      responses:
        '204': { description: Signed out }
  /api/v1/vendor/auth/invites/{token}:
    get:
      operationId: getInvite
      x-proposal: true
      description: Who an invite link is for, so the set-password screen can greet them.
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Invite, content: { application/json: { schema: { type: object, required: [email, brand_name, owner_name], properties: { email: { type: string }, brand_name: { type: string }, owner_name: { type: string } } } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/vendor/auth/accept-invite:
    post:
      operationId: acceptInvite
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string } } } } } }
      responses:
        '200': { description: Password set and signed in, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/vendor/auth/password/forgot:
    post:
      operationId: forgotPassword
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [identifier], properties: { identifier: { type: string } } } } } }
      responses:
        '202': { description: 'Always accepted, so accounts are not revealed' }

  /api/v1/vendor/me:
    get:
      operationId: getMe
      x-proposal: true
      description: Changed in Build 2 - vendor.commission (per-brand Commission; commission_bps is now nullable and equals the agreed rate) and setup.store_details replaces setup.return_policy.
      responses:
        '200': { description: Signed-in seller, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/vendor/summary:
    get:
      operationId: getSummary
      x-proposal: true
      description: Counts for the sidebar, the overview figures and the review banner.
      responses:
        '200': { description: Summary, content: { application/json: { schema: { $ref: '#/components/schemas/Summary' } } } }

  /api/v1/vendor/store-details:
    get:
      operationId: getStoreDetails
      x-proposal: true
      description: The brand's sign-up details, editable after approval, with the required topics still missing; products cannot be sent for review until complete is true.
      responses:
        '200': { description: Store details, content: { application/json: { schema: { $ref: '#/components/schemas/StoreDetails' } } } }
  /api/v1/vendor/store-details/brand:
    put:
      operationId: saveStoreBrand
      x-proposal: true
      description: Saves the brand topic (who it sells for, ship-from city, Instagram or website); the store name itself changes only through Shazlo.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StoreBrandInput' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/StoreDetails' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/vendor/store-details/contact:
    put:
      operationId: saveStoreContact
      x-proposal: true
      description: Saves the contact person, mobile number and email.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Contact' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/StoreDetails' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/vendor/store-details/delivery:
    put:
      operationId: saveStoreDelivery
      x-proposal: true
      description: Saves who delivers (Shazlo picks up from the pickup address, or the brand delivers to its areas in the stated time).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Delivery' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/StoreDetails' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/vendor/store-details/returns:
    put:
      operationId: saveStoreReturns
      x-proposal: true
      description: Saves the return window, the condition and the refund time; with window_days 0 the other two are stored as null.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Returns' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/StoreDetails' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/vendor/store-details/payment:
    put:
      operationId: saveStorePayment
      x-proposal: true
      description: Saves how shoppers can pay on delivery (the pay_on_delivery topic); at least one of cash and UPI.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PayOnDelivery' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/StoreDetails' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/vendor/store-details/payout:
    put:
      operationId: saveStorePayout
      x-proposal: true
      description: Saves where Shazlo pays the brand; takes the full account number, which is only ever returned masked. 422 when the IFSC is unknown.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PayoutInput' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/StoreDetails' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/vendor/store-details/business:
    put:
      operationId: saveStoreBusiness
      x-proposal: true
      description: Saves the optional legal business name and GST number (null or empty clears them).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessDetails' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/StoreDetails' } } } }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/vendor/commission/proposal:
    post:
      operationId: proposeCommission
      x-proposal: true
      description: The brand proposes a commission rate in basis points (0-4000); an agreed rate stays in force (agreed_bps) while Shazlo decides. 422 outside the range or when it equals the agreed rate.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [rate_bps], properties: { rate_bps: { type: integer, minimum: 0, maximum: 4000 } } } } } }
      responses:
        '200': { description: Proposal waiting for Shazlo, content: { application/json: { schema: { $ref: '#/components/schemas/Commission' } } } }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/vendor/size-charts/{group}:
    parameters: [{ name: group, in: path, required: true, schema: { $ref: '#/components/schemas/SizeChartGroup' } }]
    get:
      operationId: getSizeChart
      x-proposal: true
      description: The brand's size chart for one group of product types (src/lib/catalog.ts maps types to groups); an empty chart when none is saved.
      responses:
        '200': { description: Size chart, content: { application/json: { schema: { $ref: '#/components/schemas/SizeChart' } } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: saveSizeChart
      x-proposal: true
      description: Replaces the brand's size chart for the group (centimetres, every value optional) and/or a photo of the brand's own chart.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SizeChartInput' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/SizeChart' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/vendor/brand-page:
    get:
      operationId: getBrandPage
      x-proposal: true
      responses:
        '200': { description: Draft and live versions, content: { application/json: { schema: { $ref: '#/components/schemas/BrandPage' } } } }
  /api/v1/vendor/brand-page/draft:
    put:
      operationId: saveBrandDraft
      x-proposal: true
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BrandProfile' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/BrandPage' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: discardBrandDraft
      x-proposal: true
      responses:
        '200': { description: Draft discarded, content: { application/json: { schema: { $ref: '#/components/schemas/BrandPage' } } } }
  /api/v1/vendor/brand-page/submit:
    post:
      operationId: submitBrandPage
      x-proposal: true
      responses:
        '200': { description: In review, content: { application/json: { schema: { $ref: '#/components/schemas/BrandPage' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/v1/vendor/uploads/presign:
    post:
      operationId: presignUpload
      x-proposal: true
      description: Signed Cloudinary upload for brand images, product photos and size-chart photos (docs/adr/0005); size_chart is new in Build 2.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [purpose, content_type, size_bytes], properties: { purpose: { type: string, enum: [logo, cover, product, size_chart] }, content_type: { type: string }, size_bytes: { type: integer } } } } } }
      responses:
        '200': { description: Upload target, content: { application/json: { schema: { $ref: '#/components/schemas/Presign' } } } }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }

  /api/v1/vendor/products:
    get:
      operationId: listProducts
      x-proposal: true
      description: Changed in Build 2 - ProductSummary.category is a ProductType or null and main_colour is added.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProductStatus' } }
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: gender, in: query, schema: { type: string } }
        - { name: stock, in: query, schema: { type: string, enum: [in_stock, low, out] } }
        - { name: sort, in: query, schema: { type: string, enum: [updated_desc, price_asc, price_desc, stock_asc] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 50 } }
      responses:
        '200': { description: Page of products, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } } }
    post:
      operationId: createProduct
      x-proposal: true
      description: Changed in Build 2 - Product has material, main_colour and other_colours (fabric and returns_use_default are gone); gender and category may be null on a draft.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
      responses:
        '201': { description: Draft created, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/vendor/products/bulk:
    post:
      operationId: bulkProducts
      x-proposal: true
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [action, ids], properties: { action: { type: string, enum: [submit, archive] }, ids: { type: array, items: { type: string } } } } } } }
      responses:
        '200': { description: Per-product results, content: { application/json: { schema: { type: object, required: [results], properties: { results: { type: array, items: { type: object, required: [id, ok], properties: { id: { type: string }, ok: { type: boolean }, code: { type: string }, message: { type: string } } } } } } } } }
  /api/v1/vendor/products/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getProduct
      x-proposal: true
      description: Changed in Build 2 - see Product (material, main_colour, other_colours; photo slots front, back, detail, worn, extra, tryon).
      responses:
        '200': { description: Product, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateProduct
      x-proposal: true
      description: Changed in Build 2 - takes material, main_colour and other_colours; 422 for an unknown product type, colour or size.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/vendor/products/{id}/submit:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: submitProduct
      x-proposal: true
      description: Changed in Build 2 - 422 lists every missing requirement in extra.fields under stable keys (SubmitRequirement), including store_details while the store details are incomplete.
      responses:
        '200': { description: In review, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/vendor/products/{id}/archive:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: archiveProduct
      responses:
        '200': { description: Archived, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
  /api/v1/vendor/products/{id}/images:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: addProductImage
      x-proposal: true
      description: Changed in Build 2 - attaches an uploaded photo (presign key) to a slot; a named slot (front, back, detail, worn) replaces its photo, extra holds up to 4 and tryon up to 5. Also used after bulk import, with the product id from the commit response.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [key, angle], properties: { key: { type: string }, angle: { $ref: '#/components/schemas/PhotoAngle' } } } } } }
      responses:
        '201': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/vendor/products/{id}/images/{image_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: image_id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: moveProductImage
      x-proposal: true
      description: Moves a photo to another slot without uploading again ("Make main photo" moves it to front); a taken named slot swaps the two photos. 422 when extra or tryon is full.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [angle], properties: { angle: { $ref: '#/components/schemas/PhotoAngle' } } } } } }
      responses:
        '200': { description: Moved, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeProductImage
      responses:
        '200': { description: Removed, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }

  /api/v1/vendor/reviews:
    get:
      operationId: listReviews
      x-proposal: true
      description: Everything the seller has sent for review, newest first.
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [waiting, rejected, approved] } }
        - { name: limit, in: query, schema: { type: integer, maximum: 50 } }
      responses:
        '200': { description: Review items, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewPage' } } } }

  /api/v1/vendor/imports/template.csv:
    get:
      operationId: importTemplate
      x-proposal: true
      description: Changed in Build 2 - one row per product with exactly these columns - product_name, gender, product_type, main_colour, other_colours (optional), selling_price, sizes_stock (like "S:4, M:6, L:3, XL:0"), description, material, mrp (optional).
      responses:
        '200': { description: CSV template, content: { text/csv: { schema: { type: string } } } }
  /api/v1/vendor/imports:
    post:
      operationId: startImport
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses:
        '202': { description: Checking, content: { application/json: { schema: { type: object, required: [job_id], properties: { job_id: { type: string } } } } } }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
  /api/v1/vendor/imports/{job_id}:
    parameters: [{ name: job_id, in: path, required: true, schema: { type: string } }]
    get:
      operationId: getImport
      x-proposal: true
      description: Changed in Build 2 - errors name the new template columns (field) and image_errors is gone.
      responses:
        '200': { description: Job, content: { application/json: { schema: { $ref: '#/components/schemas/ImportJob' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/vendor/imports/{job_id}/commit:
    parameters: [{ name: job_id, in: path, required: true, schema: { type: string } }]
    post:
      operationId: commitImport
      x-proposal: true
      description: Creates the ready rows as drafts and lists them (id and name), so photos picked afterwards can be matched to products by name and attached with POST products/{id}/images.
      responses:
        '200': { description: Drafts created, content: { application/json: { schema: { $ref: '#/components/schemas/ImportCommit' } } } }
        '409': { $ref: '#/components/responses/Error' }

components:
  responses:
    Error:
      description: Error envelope (docs/05-api-design.md section 2)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [message, extra]
      properties:
        message: { type: string }
        extra:
          type: object
          required: [code]
          properties:
            code: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
    VendorApplication:
      type: object
      description: Sign-up (V-02), one topic per page. Required unless marked optional; the same topics become StoreDetails after approval.
      required: [brand_name, sells, city, owner_name, phone, email, delivery, returns, pay_on_delivery, payout, agreed_terms, agreed_price_rule]
      properties:
        brand_name: { type: string, description: 'The store name shoppers see.' }
        sells: { $ref: '#/components/schemas/Sells' }
        city: { type: string, description: 'City or area the brand ships from.' }
        instagram_or_website: { type: string, description: 'Optional. An Instagram handle or a website.' }
        owner_name: { type: string }
        phone: { type: string, description: 'Indian mobile number; +91, spaces and dashes are accepted.' }
        email: { type: string }
        delivery: { $ref: '#/components/schemas/Delivery' }
        returns: { $ref: '#/components/schemas/Returns' }
        pay_on_delivery: { $ref: '#/components/schemas/PayOnDelivery' }
        payout: { $ref: '#/components/schemas/PayoutInput' }
        legal_name: { type: string, description: 'Optional legal business name.' }
        gstin: { type: string, description: 'Optional GST number (15 characters, checked with its check character).' }
        proposed_commission_bps: { type: integer, minimum: 0, maximum: 4000, description: 'Optional. The commission the brand proposes, in basis points (1200 = 12%). Leave out when a rate was agreed with the team.' }
        agreed_terms: { type: boolean, enum: [true], description: 'I agree to the seller terms.' }
        agreed_price_rule: { type: boolean, enum: [true], description: 'My price on Shazlo will never be higher than anywhere else.' }
    ApplicationReceipt:
      type: object
      required: [id, status]
      properties: { id: { type: string }, status: { type: string, enum: [applied] } }

    Sells: { type: string, enum: [women, men, both], description: 'Who the brand sells for.' }
    DeliveryDays: { type: string, enum: ['1_2', '2_3', '3_5', '5_7'], description: 'Delivery time in days when the brand delivers itself (1_2 = 1-2 days).' }
    PickupAddress:
      type: object
      required: [line1, area, city, pin]
      properties:
        line1: { type: string, description: 'House or shop number, building and street.' }
        area: { type: string }
        city: { type: string }
        pin: { type: string, pattern: '^[1-9][0-9]{5}$' }
    DeliveryByShazlo:
      type: object
      description: Shazlo's delivery service picks up orders from the pickup address.
      required: [mode, pickup_address]
      properties:
        mode: { type: string, enum: [shazlo] }
        pickup_address: { $ref: '#/components/schemas/PickupAddress' }
    DeliveryByBrand:
      type: object
      description: The brand delivers itself, to all of India or to the listed cities and PIN codes.
      required: [mode, areas, delivery_days]
      properties:
        mode: { type: string, enum: [own] }
        areas:
          type: object
          required: [all_india, places]
          properties:
            all_india: { type: boolean }
            places: { type: array, maxItems: 50, items: { type: string }, description: 'Cities or 6-digit PIN codes; empty when all_india is true.' }
        delivery_days: { $ref: '#/components/schemas/DeliveryDays' }
    Delivery:
      oneOf:
        - { $ref: '#/components/schemas/DeliveryByShazlo' }
        - { $ref: '#/components/schemas/DeliveryByBrand' }
    ReturnWindowDays: { type: integer, enum: [0, 7, 14, 30], description: 'Days a shopper has to ask for a return; 0 means no returns.' }
    ReturnCondition: { type: string, enum: [unworn_with_tags, any_reason, damaged_or_wrong] }
    RefundDays: { type: integer, enum: [2, 5, 7], description: 'Working days after pickup until the refund.' }
    Returns:
      type: object
      description: With window_days 0 (no returns) condition and refund_days do not apply - send null, and the server stores and returns null whatever is sent. With 7, 14 or 30 both are required.
      required: [window_days, condition, refund_days]
      properties:
        window_days: { $ref: '#/components/schemas/ReturnWindowDays' }
        condition: { oneOf: [{ $ref: '#/components/schemas/ReturnCondition' }, { type: 'null' }] }
        refund_days: { oneOf: [{ $ref: '#/components/schemas/RefundDays' }, { type: 'null' }] }
    PayOnDelivery:
      type: object
      description: How shoppers can pay on delivery. At least one must be true (422 key pay_on_delivery).
      required: [cash, upi]
      properties:
        cash: { type: boolean }
        upi: { type: boolean }
    BankPayoutInput:
      type: object
      required: [method, holder_name, account_number, ifsc]
      properties:
        method: { type: string, enum: [bank] }
        holder_name: { type: string }
        account_number: { type: string, description: '9 to 18 digits; spaces are ignored. Never returned.' }
        ifsc: { type: string, description: 'Like HDFC0001234 (^[A-Z]{4}0[A-Z0-9]{6}$ after upper-casing); must belong to a known bank.' }
    UpiPayoutInput:
      type: object
      required: [method, upi_id]
      properties:
        method: { type: string, enum: [upi] }
        upi_id: { type: string, description: 'Like name@okhdfcbank.' }
    PayoutInput:
      oneOf:
        - { $ref: '#/components/schemas/BankPayoutInput' }
        - { $ref: '#/components/schemas/UpiPayoutInput' }
    BankPayout:
      type: object
      description: A saved bank account, masked.
      required: [method, holder_name, bank_name, account_last4, ifsc]
      properties:
        method: { type: string, enum: [bank] }
        holder_name: { type: string }
        bank_name: { type: string, description: 'From the IFSC, like HDFC Bank.' }
        account_last4: { type: string, description: 'Shown as "•••• 4821".' }
        ifsc: { type: string }
    UpiPayout:
      type: object
      description: A saved UPI ID, masked.
      required: [method, upi_id]
      properties:
        method: { type: string, enum: [upi] }
        upi_id: { type: string, description: 'Masked, like "ka•••@okhdfcbank".' }
    Payout:
      oneOf:
        - { $ref: '#/components/schemas/BankPayout' }
        - { $ref: '#/components/schemas/UpiPayout' }
    Contact:
      type: object
      required: [name, phone, email]
      properties:
        name: { type: string }
        phone: { type: string, description: 'Stored as 10 digits.' }
        email: { type: string }
    BusinessDetails:
      type: object
      description: Optional. Empty strings are stored as null.
      required: [legal_name, gstin]
      properties:
        legal_name: { type: [string, 'null'] }
        gstin: { type: [string, 'null'] }
    StoreBrandInput:
      type: object
      required: [sells, city, instagram_or_website]
      properties:
        sells: { $ref: '#/components/schemas/Sells' }
        city: { type: string }
        instagram_or_website: { type: [string, 'null'], description: 'Optional; null or empty clears it.' }
    StoreTopic:
      type: string
      enum: [brand, contact, delivery, returns, pay_on_delivery, payout]
      description: A required store-details topic. pay_on_delivery is saved with PUT store-details/payment; business details are optional and never missing.
    StoreDetails:
      type: object
      required: [brand_name, sells, city, instagram_or_website, contact, delivery, returns, pay_on_delivery, payout, business, missing, complete, updated_at]
      properties:
        brand_name: { type: string, description: 'Read-only here; Shazlo changes the store name on request.' }
        sells: { oneOf: [{ $ref: '#/components/schemas/Sells' }, { type: 'null' }] }
        city: { type: [string, 'null'] }
        instagram_or_website: { type: [string, 'null'] }
        contact: { oneOf: [{ $ref: '#/components/schemas/Contact' }, { type: 'null' }] }
        delivery: { oneOf: [{ $ref: '#/components/schemas/Delivery' }, { type: 'null' }] }
        returns: { oneOf: [{ $ref: '#/components/schemas/Returns' }, { type: 'null' }] }
        pay_on_delivery: { oneOf: [{ $ref: '#/components/schemas/PayOnDelivery' }, { type: 'null' }] }
        payout: { oneOf: [{ $ref: '#/components/schemas/Payout' }, { type: 'null' }] }
        business: { $ref: '#/components/schemas/BusinessDetails' }
        missing: { type: array, items: { $ref: '#/components/schemas/StoreTopic' }, description: 'Required topics not yet complete, in page order.' }
        complete: { type: boolean, description: 'True when missing is empty.' }
        updated_at: { type: [string, 'null'], format: date-time }
    IfscBank:
      type: object
      required: [ifsc, bank, branch]
      properties:
        ifsc: { type: string, description: 'The code in upper case.' }
        bank: { type: string, description: 'Like HDFC Bank.' }
        branch: { type: string, description: 'Like Navrangpura, Ahmedabad.' }

    CommissionState:
      type: string
      enum: [not_set, proposed, sent_back, agreed]
      description: not_set - no rate yet; proposed - the brand's rate waits for Shazlo; sent_back - Shazlo sent the proposal back with a note; agreed - a rate is in force.
    Commission:
      type: object
      description: Per-brand commission; there is no default rate. agreed_bps can be set in every state (a new proposal does not replace the agreed rate until Shazlo approves it).
      required: [state, agreed_bps, proposed_bps, note, updated_at]
      properties:
        state: { $ref: '#/components/schemas/CommissionState' }
        agreed_bps: { type: [integer, 'null'], description: 'The rate in force, in basis points (1200 = 12%).' }
        proposed_bps: { type: [integer, 'null'], description: 'The brand''s latest proposal while proposed or sent_back; null otherwise.' }
        note: { type: [string, 'null'], description: 'Shazlo''s note when it sent the proposal back.' }
        updated_at: { type: [string, 'null'], format: date-time }

    Me:
      type: object
      required: [vendor, user, role, setup]
      properties:
        vendor:
          type: object
          required: [id, brand_name, status, approved_at, commission_bps, commission]
          properties:
            id: { type: string }
            brand_name: { type: string }
            status: { type: string, enum: [approved, suspended] }
            approved_at: { type: [string, 'null'], format: date-time }
            commission_bps: { type: [integer, 'null'], description: 'Same as commission.agreed_bps; null until a rate is agreed.' }
            commission: { $ref: '#/components/schemas/Commission' }
        user:
          type: object
          required: [id, name, email]
          properties: { id: { type: string }, name: { type: string }, email: { type: string } }
        role: { type: string, enum: [vendor_owner, vendor_staff] }
        setup:
          type: object
          required: [password_set, brand_page, first_product, store_details, live_products, live_target]
          properties:
            password_set: { type: boolean }
            brand_page: { type: boolean }
            first_product: { type: boolean }
            store_details: { type: boolean, description: 'Every required store-details topic is complete (StoreDetails.complete).' }
            live_products: { type: integer }
            live_target: { type: integer }
    Summary:
      type: object
      required: [products, reviews_waiting, oldest_waiting_hours, sent_back]
      properties:
        products: { $ref: '#/components/schemas/StatusCounts' }
        reviews_waiting: { type: integer }
        oldest_waiting_hours: { type: [integer, 'null'] }
        sent_back: { type: integer }
    StatusCounts:
      type: object
      required: [all, approved, pending_review, rejected, draft, archived]
      properties:
        all: { type: integer }
        approved: { type: integer }
        pending_review: { type: integer }
        rejected: { type: integer }
        draft: { type: integer }
        archived: { type: integer }
    BrandProfile:
      type: object
      required: [brand_name, based_in, tagline, story, logo_url, cover_url, return_policy, dispatch_time, instagram, website]
      properties:
        brand_name: { type: string }
        based_in: { type: string }
        tagline: { type: string, maxLength: 60 }
        story: { type: string, maxLength: 600 }
        logo_url: { type: [string, 'null'] }
        cover_url: { type: [string, 'null'] }
        return_policy: { type: string, enum: [no_returns, '7_day', '14_day'], deprecated: true, description: 'Superseded by StoreDetails.returns (Build 2): the brand page no longer edits returns and its preview reads store details. Kept until the brand editor stops sending it.' }
        dispatch_time: { type: string, enum: ['1_2_days', '2_3_days', '3_5_days', '5_7_days'], deprecated: true, description: 'Superseded by StoreDetails.delivery (Build 2). Kept until the brand editor stops sending it.' }
        instagram: { type: string }
        website: { type: string }
    BrandPage:
      type: object
      required: [live, live_since, draft, draft_saved_at, changed_fields, review]
      properties:
        live: { oneOf: [{ $ref: '#/components/schemas/BrandProfile' }, { type: 'null' }] }
        live_since: { type: [string, 'null'], format: date-time }
        draft: { oneOf: [{ $ref: '#/components/schemas/BrandProfile' }, { type: 'null' }] }
        draft_saved_at: { type: [string, 'null'], format: date-time }
        changed_fields: { type: array, items: { type: string } }
        review: { $ref: '#/components/schemas/ReviewState' }
    ReviewState:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [none, waiting, rejected, approved] }
        reason: { type: string }
        at: { type: string, format: date-time }
    Presign:
      type: object
      required: [upload_url, key, fields]
      properties:
        upload_url: { type: string }
        key: { type: string }
        fields: { type: object, additionalProperties: { type: string } }
    ProductStatus: { type: string, enum: [draft, pending_review, approved, rejected, archived] }
    PhotoAngle:
      type: string
      enum: [front, back, detail, worn, extra, tryon]
      description: front, back, detail and worn are the 4 required product photos (one each); extra holds up to 4 more; tryon holds the 5 required try-on photos of real people wearing it.
    Gender: { type: string, enum: [Women, Men, Unisex] }
    ProductType:
      type: string
      enum: [Kurtas, Kurtis, Sarees, Lehengas, Dupattas, Stoles, Shirts, T-shirts, Tops, Dresses, Co-ords, Skirts, Jeans, Trousers, Palazzos, Jackets, Blazers]
      description: The product type, shown to sellers as is. src/lib/catalog.ts maps each to its size-chart group and sizes.
    SubmitRequirement:
      type: string
      enum: [title, gender, category, main_colour, material, description, photos, tryon, variants, price_paise, store_details]
      description: Keys in a submit 422's extra.fields, in this order. photos - fewer than the 4 named photos; tryon - fewer than 5 try-on photos; variants - no size; price_paise - no selling price or above the MRP; store_details - store details incomplete.
    ProductSummary:
      type: object
      required: [id, title, sku, category, main_colour, status, price_paise, mrp_paise, stock, thumbnail_url, updated_at, edit_in_review, publishing]
      properties:
        id: { type: string }
        title: { type: string }
        sku: { type: string }
        category: { oneOf: [{ $ref: '#/components/schemas/ProductType' }, { type: 'null' }] }
        main_colour: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ProductStatus' }
        price_paise: { type: [integer, 'null'] }
        mrp_paise: { type: [integer, 'null'] }
        stock: { type: [integer, 'null'] }
        thumbnail_url: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }
        edit_in_review: { type: boolean }
        publishing: { type: boolean }
    ProductPage:
      type: object
      required: [items, next_cursor, total, counts]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProductSummary' } }
        next_cursor: { type: [string, 'null'] }
        total: { type: integer }
        counts: { $ref: '#/components/schemas/StatusCounts' }
    Variant:
      type: object
      required: [size, sku, stock]
      properties:
        size: { type: string, description: 'XS, S, M, L, XL, XXL, 3XL, One size, or a waist size 26-40 (src/lib/catalog.ts ALL_SIZES).' }
        sku: { type: string, description: 'Automatic product code for the size; never called SKU in seller text.' }
        stock: { type: integer, minimum: 0, description: '0 means sold out.' }
    ProductInput:
      type: object
      description: Every field is optional on PATCH; only the ones sent change. Returns and delivery come from store details, not the product.
      properties:
        title: { type: string }
        description: { type: string }
        category: { oneOf: [{ $ref: '#/components/schemas/ProductType' }, { type: 'null' }] }
        gender: { oneOf: [{ $ref: '#/components/schemas/Gender' }, { type: 'null' }] }
        material: { type: string, maxLength: 120, description: 'Free text, like "100% linen" or "Cotton mul".' }
        main_colour: { type: [string, 'null'], description: 'One of the named colours in src/lib/catalog.ts COLOURS, including Multicolour.' }
        other_colours: { type: array, maxItems: 2, items: { type: string }, description: 'Up to 2 more named colours, different from the main colour.' }
        price_paise: { type: [integer, 'null'] }
        mrp_paise: { type: [integer, 'null'], description: 'Optional. The selling price cannot be above it.' }
        variants: { type: array, items: { $ref: '#/components/schemas/Variant' } }
    Product:
      type: object
      required: [id, title, description, category, gender, material, main_colour, other_colours, sku, status, price_paise, mrp_paise, images, variants, review, history, updated_at, edit_in_review]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        category: { oneOf: [{ $ref: '#/components/schemas/ProductType' }, { type: 'null' }] }
        gender: { oneOf: [{ $ref: '#/components/schemas/Gender' }, { type: 'null' }] }
        material: { type: string, description: 'Empty until the seller adds it.' }
        main_colour: { type: [string, 'null'] }
        other_colours: { type: array, maxItems: 2, items: { type: string } }
        sku: { type: string }
        status: { $ref: '#/components/schemas/ProductStatus' }
        price_paise: { type: [integer, 'null'] }
        mrp_paise: { type: [integer, 'null'] }
        images:
          type: array
          items:
            type: object
            required: [id, url, angle]
            properties: { id: { type: string }, url: { type: string }, angle: { $ref: '#/components/schemas/PhotoAngle' } }
        variants: { type: array, items: { $ref: '#/components/schemas/Variant' } }
        review: { $ref: '#/components/schemas/ReviewState' }
        history:
          type: array
          items:
            type: object
            required: [at, event]
            properties:
              at: { type: string, format: date-time }
              event: { type: string, enum: [created, submitted, rejected, approved, archived] }
              note: { type: string }
        updated_at: { type: string, format: date-time }
        edit_in_review: { type: boolean }
    ReviewItem:
      type: object
      required: [id, subject, kind, state, submitted_at]
      properties:
        id: { type: string }
        subject:
          type: object
          required: [type, id, title]
          properties:
            type: { type: string, enum: [product, brand_page] }
            id: { type: string }
            title: { type: string }
            detail: { type: string }
            thumbnail_url: { type: [string, 'null'] }
        kind: { type: string, enum: [new, edit] }
        state: { type: string, enum: [waiting, rejected, approved] }
        submitted_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
        reason: { type: string }
        publishing: { type: boolean }
    ReviewPage:
      type: object
      required: [items, counts]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReviewItem' } }
        counts:
          type: object
          required: [all, waiting, rejected, approved]
          properties: { all: { type: integer }, waiting: { type: integer }, rejected: { type: integer }, approved: { type: integer } }
    ImportColumn:
      type: string
      enum: [product_name, gender, product_type, main_colour, other_colours, selling_price, sizes_stock, description, material, mrp]
      description: The template's columns, in order (PDF section 4). other_colours and mrp are optional.
    ImportJob:
      type: object
      description: Changed in Build 2 - one row per product, no image columns (photos are added by product name after import), so image_errors is gone and ok_products equals ok_rows.
      required: [id, status, file_name, total_rows, ok_rows, ok_products, error_rows, errors]
      properties:
        id: { type: string }
        status: { type: string, enum: [checking, ready, committed, failed], description: 'failed when the header is missing a required column (errors then name the columns, row 1).' }
        file_name: { type: string }
        total_rows: { type: integer }
        ok_rows: { type: integer }
        ok_products: { type: integer, description: 'Drafts the ready rows become (one per row).' }
        error_rows: { type: integer }
        errors:
          type: array
          items:
            type: object
            required: [row, product, column, field, message]
            properties:
              row: { type: integer, description: 'Spreadsheet row number; the header is row 1.' }
              product: { type: [string, 'null'], description: 'The row''s product name, if it has one.' }
              column: { type: string, description: 'The column in plain words, like "Sizes and stock".' }
              field: { oneOf: [{ $ref: '#/components/schemas/ImportColumn' }, { type: 'null' }], description: 'The template column, or null for a problem with the whole row.' }
              message: { type: string, description: 'What to fix, in plain words.' }
    ImportCommit:
      type: object
      required: [created, products]
      properties:
        created: { type: integer }
        products:
          type: array
          description: The drafts just created, in file order.
          items:
            type: object
            required: [id, title]
            properties: { id: { type: string }, title: { type: string } }

    SizeChartGroup:
      type: string
      enum: [bottoms, tops, dresses, jackets]
      description: Product types share a chart by group (src/lib/catalog.ts SIZE_CHART_GROUP); sarees, dupattas and stoles have none.
    SizeChartMeasurements:
      type: object
      description: 'Centimetres by size, then by measurement: { "M": { "bust": 96, "waist": 84, "hip": null, "length": 112 } }. Measurements are the group''s (bottoms - waist, hip, inseam, length; tops and jackets - chest, shoulder, sleeve, length; dresses - bust, waist, hip, length). Saved sizes come back with every measurement of the group (null when blank); sizes left wholly blank are dropped.'
      additionalProperties:
        type: object
        additionalProperties: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 300 }
    SizeChart:
      type: object
      required: [group, measurements, photo_url, updated_at]
      properties:
        group: { $ref: '#/components/schemas/SizeChartGroup' }
        measurements: { $ref: '#/components/schemas/SizeChartMeasurements' }
        photo_url: { type: [string, 'null'], description: 'A photo of the brand''s own chart (upload with purpose size_chart).' }
        updated_at: { type: [string, 'null'], format: date-time, description: 'Null when nothing is saved yet.' }
    SizeChartInput:
      type: object
      required: [measurements, photo_url]
      properties:
        measurements: { $ref: '#/components/schemas/SizeChartMeasurements' }
        photo_url: { type: [string, 'null'] }
