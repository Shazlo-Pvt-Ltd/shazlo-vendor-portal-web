<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shazlo Seller</title>
    <meta name="description" content="Add products, follow reviews and run your store on Shazlo." />
    <!-- Matches the off-white top bar, so the phone's status bar blends into it. -->
    <meta name="theme-color" content="#FFFCE3" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <!-- Home-screen app on iPhone and iPad. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Shazlo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Order and PIN numbers are not phone numbers. -->
    <meta name="format-detection" content="telephone=no" />
    <!-- The canvas colour before the app's styles load, so there is no white flash. -->
    <style>html, body { background-color: #FFF8E1; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
